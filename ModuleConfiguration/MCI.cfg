// Compile-time MCI limits. These replace the former hardcoded bounds and may
// be changed before compiling the library. MCISemanticIdMaxComponents must
// remain one greater than MCIExpansionDepthLimit.
MCIExpansionCountLimit     = 64,
MCIExpansionDepthLimit     = 64,
MCIExpandedFieldLimit      = 1024,
MCISemanticIdMaxComponents = MCIExpansionDepthLimit + 1
