repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.1.0
  hooks:
  - id: check-yaml
  - id: trailing-whitespace
  - id: end-of-file-fixer
- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: v23.1.3
  hooks:
  - id: clang-format
    types_or: [c, c++, cuda]
- repo: local
  hooks:
  - id: fortran-style
    name: Fortran style (style/FortranStyleCheck.py)
    entry: python3 style/FortranStyleCheck.py
    language: system
    files: '\.(M90|F90|cf)$'
  - id: cdoc-style
    name: Header documentation style (style/CDocStyleCheck.py)
    entry: python3 style/CDocStyleCheck.py
    language: system
    files: '\.h$'
